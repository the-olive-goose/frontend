<!doctype html>
<html lang="en-IE">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1D2B1B" />

    <!-- Default metadata; per-route values are applied at runtime by SeoManager -->
    <title>The Olive Goose | Handmade Café-Inspired Candles</title>
    <meta name="description" content="Hand-poured, café-culture-inspired candles made in Dublin, Ireland. Matcha Hour, Morning Ritual, Pink Order & more. Shop The Olive Goose." />
    <link rel="canonical" href="https://theolivegoose.ie/" />

    <!-- Open Graph / social sharing (static defaults — social crawlers don't run JS) -->
    <meta property="og:title" content="The Olive Goose | Handmade Café-Inspired Candles" />
    <meta property="og:description" content="Hand-poured, café-culture-inspired candles made in Dublin, Ireland. Matcha Hour, Morning Ritual, Pink Order & more." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://theolivegoose.ie/" />
    <meta property="og:site_name" content="The Olive Goose" />
    <meta property="og:locale" content="en_IE" />
    <meta property="og:image" content="https://theolivegoose.ie/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Olive Goose — handmade café-inspired candles from Dublin" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Olive Goose | Handmade Café-Inspired Candles" />
    <meta name="twitter:description" content="Hand-poured, café-culture-inspired candles made in Dublin, Ireland." />
    <meta name="twitter:image" content="https://theolivegoose.ie/og-image.jpg" />

    <!-- Fonts: preconnect + stylesheet link (moved out of a render-blocking CSS @import) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Permanent+Marker&family=Fredoka:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data: Organization + WebSite (site-wide, static) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://theolivegoose.ie/#organization",
        "name": "The Olive Goose",
        "url": "https://theolivegoose.ie/",
        "logo": "https://theolivegoose.ie/favicon.png",
        "description": "Handmade, café-culture-inspired candles hand-poured in Dublin, Ireland.",
        "sameAs": [
          "https://www.instagram.com/theolivegoose",
          "https://www.tiktok.com/@theolivegoose"
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://theolivegoose.ie/#website",
        "name": "The Olive Goose",
        "url": "https://theolivegoose.ie/",
        "publisher": { "@id": "https://theolivegoose.ie/#organization" },
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://theolivegoose.ie/shop?search={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

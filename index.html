<!doctype html>
<html lang="en-IE">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicons. Google needs a square icon that is a multiple of 48px and is
         legible at ~16-32px, so these are a head-crop of the mascot artwork in
         src/assets/M2.png — the sunglasses and beak survive the downscale, where
         the full lockup in /logo.png (and the whole goose-and-candle scene) does
         not. Regenerate all sizes together so they stay consistent. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon-96.png" sizes="96x96" />
    <link rel="icon" type="image/png" href="/favicon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1D2B1B" />

    <!-- Default metadata; per-route values are applied at runtime by SeoManager -->
    <title>The Olive Goose — the goose insisted, we made candles</title>
    <meta name="description" content="Hand-poured, café-culture-inspired candles made in Dublin, Ireland. Matcha Hour, Morning Ritual, Pink Order & more. Shop The Olive Goose." />
    <link rel="canonical" href="https://theolivegoose.ie/" />

    <!-- Open Graph / social sharing (static defaults — social crawlers don't run JS) -->
    <meta property="og:title" content="The Olive Goose — the goose insisted, we made candles" />
    <meta property="og:description" content="Hand-poured, café-culture-inspired candles made in Dublin, Ireland. Matcha Hour, Morning Ritual, Pink Order & more." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://theolivegoose.ie/" />
    <meta property="og:site_name" content="The Olive Goose" />
    <meta property="og:locale" content="en_IE" />
    <meta property="og:image" content="https://theolivegoose.ie/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Olive Goose — handmade café-inspired candles from Dublin" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Olive Goose — the goose insisted, we made candles" />
    <meta name="twitter:description" content="Hand-poured, café-culture-inspired candles made in Dublin, Ireland." />
    <meta name="twitter:image" content="https://theolivegoose.ie/og-image.jpg" />

    <!-- Fonts: preconnect + stylesheet link (moved out of a render-blocking CSS @import) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Permanent+Marker&family=Fredoka:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data: Organization + LocalBusiness + WebSite (site-wide, static).
         The Organization and WebSite blocks carry ids because Admin → Ops → SEO
         patches their name/logo at runtime (see applyBranding in src/lib/seo.ts). -->
    <script type="application/ld+json" id="site-organization-jsonld">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://theolivegoose.ie/#organization",
        "name": "The Olive Goose",
        "alternateName": ["Olive Goose", "Olive Goose Candles", "The Olive Goose Candles", "The Olive Goose Ireland"],
        "url": "https://theolivegoose.ie/",
        "logo": "https://theolivegoose.ie/logo.png",
        "description": "Independent Irish candle company hand-pouring luxury café-inspired soy candles and home fragrance in Dublin, Ireland.",
        "email": "hello@theolivegoose.com",
        "foundingLocation": { "@type": "Place", "name": "Dublin, Ireland" },
        "sameAs": [
          "https://www.instagram.com/theolivegoose",
          "https://www.tiktok.com/@theolivegoose"
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Store",
        "@id": "https://theolivegoose.ie/#localbusiness",
        "name": "The Olive Goose Studio",
        "parentOrganization": { "@id": "https://theolivegoose.ie/#organization" },
        "url": "https://theolivegoose.ie/",
        "image": "https://theolivegoose.ie/og-image.jpg",
        "description": "Candle studio and collection point for The Olive Goose — handmade café-inspired soy candles, coffee-scented candles and luxury home fragrance, made in Dublin.",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "14 Beacon Court",
          "addressLocality": "Dublin",
          "postalCode": "D18 K7W2",
          "addressCountry": "IE"
        },
        "openingHoursSpecification": {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
          "opens": "10:00",
          "closes": "17:00"
        },
        "areaServed": [
          { "@type": "Country", "name": "Ireland" },
          { "@type": "City", "name": "Dublin" }
        ],
        "currenciesAccepted": "EUR",
        "priceRange": "€€"
      }
    </script>
    <script type="application/ld+json" id="site-website-jsonld">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://theolivegoose.ie/#website",
        "name": "The Olive Goose",
        "url": "https://theolivegoose.ie/",
        "publisher": { "@id": "https://theolivegoose.ie/#organization" },
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://theolivegoose.ie/shop?search={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
